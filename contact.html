<!DOCTYPE html>
<html lang="el">
<head>

  <link rel="stylesheet" href="css/style.css">
  <style>
    .contact-wrap-v2 {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 4rem;
      align-items: start;
    }
    .ghl-form-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      min-height: 860px;
      position: relative;
    }
    .ghl-form-wrap iframe {
      display: block;
      width: 100%;
      border: none;
      min-height: 860px;
    }
    @media (max-width: 900px) {
      .contact-wrap-v2 { grid-template-columns: 1fr; }
      .ghl-form-wrap { min-height: 700px; }
      .ghl-form-wrap iframe { min-height: 700px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html"><img src="images/logo.png" alt="Dyo Sigma" style="height:56px;width:auto;display:block;"></a>
  <ul class="nav-links">
    <li><a href="index.html#services" data-i18n="nav_services"></a></li>
    <li><a href="about.html" data-i18n="nav_about"></a></li>
    <li><a href="portfolio.html" data-i18n="nav_portfolio"></a></li>

  <div class="nav-right">

      <button class="lang-btn" data-lang="el">ΕΛ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <a href="contact.html" class="btn-cta" data-i18n="nav_cta"></a>
  </div>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="mobile-menu">
  <a href="index.html#services" data-i18n="nav_services"></a>
  <a href="about.html" data-i18n="nav_about"></a>
  <a href="portfolio.html" data-i18n="nav_portfolio"></a>
  <a href="blog.html" data-i18n="nav_blog"></a>
  <a href="index.html#pricing" data-i18n="nav_pricing"></a>
  <a href="contact.html" class="btn-cta" data-i18n="nav_cta"></a>
</div>

<main>

<section class="page-hero">
  <div class="container">
    <span class="section-label fade-up" data-i18n="contact_label"></span>
    <h1 class="fade-up delay-1" data-i18n="contact_h2"></h1>
    <p class="fade-up delay-2" data-i18n="contact_sub"></p>
  </div>
</section>

<section>
  <div class="container">
    <div class="contact-wrap-v2">

      <!-- Info sidebar -->
      <div class="contact-info">
        <h2 style="margin-bottom:1rem;" data-i18n="contact_h2"></h2>
        <p style="margin-bottom:2rem;" data-i18n="contact_sub"></p>

        <div class="contact-detail">
          <div class="ico">📧</div>
          <div>
            <div style="font-family:var(--font-display);font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:2px;" data-i18n="contact_email_label"></div>
            <a href="mailto:stathiss@dyo-sigma.com" style="color:var(--white);font-size:0.95rem;">stathiss@dyo-sigma.com</a>
          </div>
        </div>

        <!-- Testimonial -->
        <div class="testi-card" style="margin-top:2.5rem;">
          <div class="stars">★★★★★</div>
          <p class="testi-body" data-i18n="t1_body"></p>
          <div class="testi-author">
            <div class="avatar">ΚΤ</div>
            <div class="testi-info">
              <strong data-i18n="t1_name"></strong>
              <span data-i18n="t1_role"></span>
            </div>
          </div>
        </div>

        <!-- Why us bullets -->
        <div style="margin-top:2rem; display:flex; flex-direction:column; gap:0.75rem;">
          <div class="why-feature">
            <div class="why-feature-icon">⚡</div>
            <div class="why-feature-text"><h4 data-i18n="why_f1"></h4></div>
          </div>
          <div class="why-feature">
            <div class="why-feature-icon">🎯</div>
            <div class="why-feature-text"><h4 data-i18n="why_f2"></h4></div>
          </div>
          <div class="why-feature">
            <div class="why-feature-icon">📈</div>
            <div class="why-feature-text"><h4 data-i18n="why_f4"></h4></div>
          </div>
        </div>
      </div>

      <!-- GHL Embedded Form -->
      <div class="ghl-form-wrap">
        <iframe
          src="https://links.dyo-sigma.com/widget/form/Puwg4xay4pBHvmNxbjVW"
          id="contact-form-Puwg4xay4pBHvmNxbjVW"
          data-layout='{"id":"INLINE"}'
          data-trigger-type="alwaysShow"
          data-trigger-value=""
          data-activation-type="alwaysActivated"
          data-activation-value=""
          data-deactivation-type="neverDeactivate"
          data-deactivation-value=""
          data-form-name="Dyo Sigma Website Form"
          data-height="847"
          data-layout-iframe-id="contact-form-Puwg4xay4pBHvmNxbjVW"
          data-form-id="Puwg4xay4pBHvmNxbjVW"
          title="Dyo Sigma Website Form"
        ></iframe>
        <script src="https://links.dyo-sigma.com/js/form_embed.js"></script>
      </div>

    </div>
  </div>
</section>

</main>

<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <a href="index.html"><img src="images/logo.png" alt="Dyo Sigma" style="height:44px;width:auto;display:block;"></a>
        <p data-i18n="footer_tagline"></p>
      </div>
      <div class="footer-col"><h5 data-i18n="footer_services_h"></h5><ul><li><a href="index.html#services" data-i18n="footer_s1"></a></li><li><a href="index.html#services" data-i18n="footer_s2"></a></li><li><a href="index.html#services" data-i18n="footer_s3"></a></li><li><a href="index.html#services" data-i18n="footer_s4"></a></li></ul></div>
      <div class="footer-col"><h5 data-i18n="footer_company_h"></h5><ul><li><a href="about.html" data-i18n="footer_c1"></a></li><li><a href="portfolio.html" data-i18n="footer_c2"></a></li><li><a href="blog.html" data-i18n="footer_c3"></a></li><li><a href="contact.html" data-i18n="footer_c4"></a></li></ul></div>
      <div class="footer-col"><h5 data-i18n="footer_solutions_h"></h5><ul><li><a href="#" data-i18n="footer_l1"></a></li><li><a href="#" data-i18n="footer_l2"></a></li><li><a href="#" data-i18n="footer_l3"></a></li><li><a href="#" data-i18n="footer_l4"></a></li></ul></div>
    </div>
    <div class="footer-bottom">
      <span data-i18n="footer_copyright"></span>
      <div class="lang-switch"><button class="lang-btn" data-lang="el">ΕΛ</button><button class="lang-btn" data-lang="en">EN</button></div>
    </div>
  </div>
</footer>
