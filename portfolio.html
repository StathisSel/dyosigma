  </div>
</section>

        <div class="portfolio-info">
          <span class="portfolio-tag" data-i18n="proj1_tag"></span>

          <p data-i18n="proj1_desc"></p>
        </div>
      </div>

      <div class="portfolio-card">
        <div class="portfolio-thumb" style="background: linear-gradient(135deg, rgba(0,212,170,0.15), rgba(79,124,255,0.1));">❤️</div>
        <div class="portfolio-info">
          <span class="portfolio-tag" data-i18n="proj2_tag"></span>
          <h3 data-i18n="proj2_title"></h3>

          <p data-i18n="proj3_desc"></p>

      </div>

      <div class="portfolio-card">
        <div class="portfolio-thumb" style="background: linear-gradient(135deg, rgba(100,100,255,0.1), rgba(0,212,170,0.1));">🏢</div>
        <div class="portfolio-info">
          <span class="portfolio-tag" data-i18n="proj4_tag"></span>
          <h3 data-i18n="proj4_title"></h3>
          <p data-i18n="proj4_desc"></p>
        </div>
      </div>

    </div>
  </div>

  <div class="container text-center">
    <h2 style="margin-bottom:1rem;" data-i18n="testi_h2"></h2>
    <p class="section-sub" style="margin: 0 auto 2rem;" data-i18n="testi_sub"></p>
    <a href="contact.html" class="btn-cta" data-i18n="nav_cta"></a>
  </div>
</section>
